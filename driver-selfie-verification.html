<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Alygo Selfie Verification Diagnostics</title>
    <!-- Standard google fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-dark: #0f172a;
        --bg-card: #1e293b;
        --primary: #3b82f6;
        --success: #10b981;
        --danger: #ef4444;
        --text: #f8fafc;
        --text-muted: #94a3b8;
      }

      body {
        font-family: "Outfit", sans-serif;
        background-color: var(--bg-dark);
        color: var(--text);
        margin: 0;
        padding: 2rem;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, #60a5fa, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p.subtitle {
        color: var(--text-muted);
        margin-bottom: 2rem;
      }

      .card {
        background-color: var(--bg-card);
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        margin-bottom: 1.5rem;
        border: 1px solid #334155;
      }

      .form-group {
        margin-bottom: 1.2rem;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--text-muted);
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      input[type="text"] {
        width: 100%;
        background-color: #0f172a;
        border: 1px solid #334155;
        border-radius: 0.5rem;
        padding: 0.75rem;
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.9rem;
        box-sizing: border-box;
        transition: border 0.2s;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: var(--primary);
      }

      input[type="file"] {
        width: 100%;
        color: var(--text-muted);
        background-color: #0f172a;
        padding: 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid #334155;
        box-sizing: border-box;
      }

      .btn-container {
        display: flex;
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .btn {
        flex: 1;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 0.5rem;
        padding: 0.85rem 1.5rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      .btn-secondary {
        background-color: #475569;
      }

      .btn:active {
        transform: translateY(0);
      }

      .response-area {
        background-color: #020617;
        border: 1px solid #1e293b;
        border-radius: 0.5rem;
        padding: 1.5rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.85rem;
        overflow-x: auto;
        white-space: pre-wrap;
        color: #38bdf8;
        max-height: 400px;
      }

      .status-badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 2rem;
        font-weight: 600;
        font-size: 0.8rem;
        margin-bottom: 1rem;
      }

      .status-idle { background-color: #475569; color: white; }
      .status-loading { background-color: #d97706; color: white; }
      .status-success { background-color: #059669; color: white; }
      .status-error { background-color: #dc2626; color: white; }

      .preview-box {
        margin-top: 1rem;
        max-height: 200px;
        display: none;
        border-radius: 0.5rem;
        border: 2px dashed #475569;
        padding: 0.5rem;
        text-align: center;
        background-color: #0f172a;
      }

      .preview-image {
        max-height: 180px;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Alygo Driver Selfie Verification</h1>
      <p class="subtitle">Diagnostic Client & API Test Sandbox</p>

      <div class="card">
        <div class="form-group">
          <label for="baseUrl">Backend API Base URL</label>
          <input type="text" id="baseUrl" value="http://10.10.7.10:5005/api/v1" placeholder="http://localhost:5005/api/v1" />
        </div>

        <div class="form-group">
          <label for="token">Driver Authentication (Bearer JWT Token)</label>
          <input type="text" id="token" placeholder="Paste your authorization JWT token here..." />
        </div>

        <div class="form-group">
          <label for="selfieFile">Selfie Image File</label>
          <input type="file" id="selfieFile" accept="image/*" />
          <div class="preview-box" id="previewBox">
            <img class="preview-image" id="previewImage" src="" alt="Selfie Preview" />
          </div>
        </div>

        <div class="btn-container">
          <button class="btn" id="btnBase64">
            Verify via Base64 JSON
          </button>
          <button class="btn btn-secondary" id="btnFormData">
            Verify via Multipart Form-Data
          </button>
        </div>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3 style="margin: 0; font-size: 1.2rem;">API Response Output</h3>
          <span class="status-badge status-idle" id="statusBadge">Idle</span>
        </div>
        <pre class="response-area" id="responseArea">Waiting for request to initiate...</pre>
      </div>
    </div>

    <script>
      const fileInput = document.getElementById("selfieFile");
      const previewBox = document.getElementById("previewBox");
      const previewImage = document.getElementById("previewImage");
      const baseUrlInput = document.getElementById("baseUrl");
      const tokenInput = document.getElementById("token");
      const responseArea = document.getElementById("responseArea");
      const statusBadge = document.getElementById("statusBadge");

      // Auto update target IP based on window origin
      if (window.location.hostname !== "127.0.0.1" && window.location.hostname !== "localhost" && window.location.hostname) {
        baseUrlInput.value = `http://${window.location.hostname}:5005/api/v1`;
      }

      // Preview Image upload
      fileInput.addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(event) {
            previewImage.src = event.target.result;
            previewBox.style.display = "block";
          };
          reader.readAsDataURL(file);
        } else {
          previewBox.style.display = "none";
        }
      });

      function setStatus(status, text) {
        statusBadge.className = `status-badge status-${status}`;
        statusBadge.textContent = text;
      }

      // Read file helper
      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve(reader.result);
          reader.onerror = error => reject(error);
        });
      }

      // 1. JSON Request (Base64)
      document.getElementById("btnBase64").addEventListener("click", async () => {
        const file = fileInput.files[0];
        const token = tokenInput.value.trim();
        const baseUrl = baseUrlInput.value.trim();

        if (!file) {
          alert("Please select a selfie file first!");
          return;
        }

        if (!token) {
          alert("Please enter a Driver JWT token!");
          return;
        }

        setStatus("loading", "Sending JSON...");
        responseArea.textContent = "Processing image file and sending POST request...";
        responseArea.style.color = "#fbbf24";

        try {
          const base64Data = await fileToBase64(file);
          
          const response = await fetch(`${baseUrl}/drivers/me/verify-selfie`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
              liveSelfie: base64Data
            })
          });

          const result = await response.json();
          responseArea.textContent = JSON.stringify(result, null, 2);
          
          if (response.ok && result.success) {
            setStatus("success", "Verified!");
            responseArea.style.color = "#34d399";
          } else {
            setStatus("error", `Error ${response.status}`);
            responseArea.style.color = "#f87171";
          }
        } catch (error) {
          setStatus("error", "Failed");
          responseArea.textContent = `Request Failed:\n${error.message}`;
          responseArea.style.color = "#f87171";
        }
      });

      // 2. Multipart Form-Data Request
      document.getElementById("btnFormData").addEventListener("click", async () => {
        const file = fileInput.files[0];
        const token = tokenInput.value.trim();
        const baseUrl = baseUrlInput.value.trim();

        if (!file) {
          alert("Please select a selfie file first!");
          return;
        }

        if (!token) {
          alert("Please enter a Driver JWT token!");
          return;
        }

        setStatus("loading", "Sending Form-Data...");
        responseArea.textContent = "Preparing form data and sending POST request...";
        responseArea.style.color = "#fbbf24";

        try {
          const formData = new FormData();
          formData.append("liveSelfie", file);

          const response = await fetch(`${baseUrl}/drivers/me/verify-selfie`, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${token}`
            },
            body: formData
          });

          const result = await response.json();
          responseArea.textContent = JSON.stringify(result, null, 2);

          if (response.ok && result.success) {
            setStatus("success", "Verified!");
            responseArea.style.color = "#34d399";
          } else {
            setStatus("error", `Error ${response.status}`);
            responseArea.style.color = "#f87171";
          }
        } catch (error) {
          setStatus("error", "Failed");
          responseArea.textContent = `Request Failed:\n${error.message}`;
          responseArea.style.color = "#f87171";
        }
      });
    </script>
  </body>
</html>
